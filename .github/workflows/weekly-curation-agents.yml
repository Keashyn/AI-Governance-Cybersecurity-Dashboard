name: Weekly curation agents
on:
  schedule:
    - cron: "30 15 * * 1"   # Mondays 15:30 UTC, after the 13:17 daily job
  workflow_dispatch:
concurrency:
  group: curation
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: ${{ github.event_name == 'workflow_dispatch' }}
          prompt: |
            Read agents/PROMPTS.md and run the weekly pipeline it describes
            (research, verification, update). Work on a new branch from master.
            Never push to master. Open a pull request with the change report.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash(python3:*),Bash(git:*),Bash(gh pr:*)"
